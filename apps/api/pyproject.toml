[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradelens-api"
version = "0.1.0"
description = "TradeLens AI API Backend"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.28",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pandas>=2.2.1",
    "openai>=1.14.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0"
]
